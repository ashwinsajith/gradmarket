[project]
name = "gradmarket"
version = "0.1.0"
description = "Daily tracking of UK early-careers job postings"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "psycopg_pool>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The web service's template and static assets ship inside the package —
# without this, `pip install .` (the Dockerfile) leaves them out.
[tool.setuptools.package-data]
"gradmarket.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[project.scripts]
gradmarket-ingest = "gradmarket.ingest:main"
gradmarket-parse = "gradmarket.parse_run:main"
gradmarket-classify = "gradmarket.classify_run:main"
gradmarket-pipeline = "gradmarket.pipeline:main"